<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Sreeram Balamurugan — Architect. Payments, identity, and developer tooling.">
  <style>
    .paper { fill: #f3f1ec; }
    .ink { fill: #0e0e0c; }
    .muted { fill: #5f5e58; }
    .accent { fill: #b83230; }
    .rule { stroke: #cfccc2; stroke-width: 1; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
    .name { font-size: 92px; font-weight: 700; letter-spacing: -0.035em; }
    .label { font-size: 13px; }
    .now { font-size: 15px; letter-spacing: 0.02em; }
    .band-text { font-size: 15px; fill: #f3f1ec; }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .45s; }
    .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; } .d6 { animation-delay: .9s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .pulse { transform-origin: 868px 102px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .marquee { animation: scroll 38s linear infinite; }
    @keyframes scroll { to { transform: translateX(-1200px); } }

    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; opacity: 1; }
      .pulse, .caret, .marquee { animation: none; }
    }
  </style>

  <rect class="paper" width="1200" height="440" rx="14"/>

  <!-- top meta bar -->
  <g class="rise d1">
    <text class="mono label ink" x="48" y="52">SRB / INDEX</text>
    <text class="mono label muted" x="600" y="52" text-anchor="middle">PORTFOLIO v4.2.0 · SREERAMS.IN</text>
    <text class="mono label muted" x="1152" y="52" text-anchor="end">CHENNAI · IST +05:30</text>
    <line class="rule" x1="48" y1="70" x2="1152" y2="70"/>
  </g>

  <!-- name -->
  <g class="rise d2">
    <text class="mono label accent" x="48" y="118">§ 01 — ARCHITECT</text>
    <text class="sans name ink" x="44" y="206">Sreeram</text>
    <text class="sans name ink" x="44" y="296">Balamurugan<tspan class="accent">.</tspan></text>
  </g>

  <g class="rise d3">
    <text class="sans muted" x="48" y="340" font-size="20">Payments, identity, and developer tooling<tspan class="ink">  —  I build software, for myself.</tspan><tspan class="caret accent" font-weight="700">▍</tspan></text>
  </g>

  <!-- now column -->
  <line class="rule" x1="840" y1="90" x2="840" y2="356"/>
  <g class="rise d3">
    <circle class="accent pulse" cx="868" cy="102" r="5"/>
    <text class="mono label ink" x="884" y="107">NOW</text>
  </g>
  <g class="rise d4">
    <text class="mono label muted" x="868" y="150">BUILDING</text>
    <text class="sans now ink" x="868" y="172">EMV Android SDK</text>
  </g>
  <g class="rise d5">
    <text class="mono label muted" x="868" y="212">SHIPPING</text>
    <text class="sans now ink" x="868" y="234">GURL — CLI API workbench</text>
  </g>
  <g class="rise d6">
    <text class="mono label muted" x="868" y="274">BUILDING</text>
    <text class="sans now ink" x="868" y="296">Burrow — encrypted messenger</text>
    <text class="sans now ink" x="868" y="322">Intent Launcher — Android</text>
  </g>

  <!-- marquee band -->
  <clipPath id="band"><rect x="0" y="380" width="1200" height="60" rx="0"/></clipPath>
  <path class="ink" d="M0 380 H1200 V426 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 Z"/>
  <g clip-path="url(#band)">
    <g class="marquee">
      <text class="mono band-text" x="0" y="416" textLength="1200" lengthAdjust="spacing">PAYMENTS ARCHITECTURE ✦ EMV KERNELS ✦ AI AGENT ORCHESTRATION ✦ IDENTITY PLATFORMS ✦ DEVELOPER TOOLING ✦ </text>
      <text class="mono band-text" x="1200" y="416" textLength="1200" lengthAdjust="spacing">PAYMENTS ARCHITECTURE ✦ EMV KERNELS ✦ AI AGENT ORCHESTRATION ✦ IDENTITY PLATFORMS ✦ DEVELOPER TOOLING ✦ </text>
    </g>
  </g>
</svg>
